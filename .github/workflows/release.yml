# Publication npm — declenchee par un tag "<lib>@<version>" pousse sur GitHub.
# Authentification par TRUSTED PUBLISHING (OIDC) — aucun jeton a renouveler : GitHub prouve a npm
# l'identite du workflow (permission id-token: write). Configuration cote npmjs.com, pour chaque
# package : Settings → Trusted Publisher → GitHub Actions, organisation jaltech-io, depot
# vuejs-libs, workflow release.yml, « Allowed actions » : AUCUNE case cochee (stage publish seul).
# PUBLICATION EN ATTENTE (staged publishing, recommandee par npm) : la CI depose la version, elle ne
# sort qu'une fois APPROUVEE par un humain avec sa double authentification (npmjs.com ou
# `npm stage approve <id>`) — un depot compromis ne peut rien publier seul. Prerequis : npm >= 11.15,
# Node >= 22.14.
# Le 27/09/2026, l'essai echouait (ENEEDAUTH/E401) : la permission id-token manquait au job.
name: release
on:
  push:
    tags: ["*@*"]

jobs:
  publication:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC : jeton d'identite pour le trusted publishing npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Outillage pnpm + npm
        run: |
          npm install --global npm@11.18.0
          corepack enable && corepack prepare pnpm@10.12.1 --activate
      - name: Valider, construire et publier la lib du tag
        env:
          TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          PROJECT="${TAG%@*}"
          VERSION="${TAG#*@}"
          case "$TAG" in
            "$PROJECT@$VERSION") ;;
            *) echo "❌ Tag $TAG invalide (attendu: <lib>@<version>)"; exit 1 ;;
          esac

          PACKAGE_JSON="$PROJECT/package.json"
          test -f "$PACKAGE_JSON" || { echo "❌ $PACKAGE_JSON introuvable"; exit 1; }

          EXPECTED_NAME="@jaltech/$PROJECT"
          PACKAGE_NAME=$(node -p "require('./$PACKAGE_JSON').name")
          PACKAGE_VERSION=$(node -p "require('./$PACKAGE_JSON').version")
          PACKAGE_LICENSE=$(node -p "require('./$PACKAGE_JSON').license")
          PACKAGE_PRIVATE=$(node -p "String(require('./$PACKAGE_JSON').private === true)")
          PACKAGE_ACCESS=$(node -p "require('./$PACKAGE_JSON').publishConfig?.access ?? ''")

          [ "$PACKAGE_NAME" = "$EXPECTED_NAME" ] || { echo "❌ Nom de package $PACKAGE_NAME != $EXPECTED_NAME"; exit 1; }
          [ "$PACKAGE_VERSION" = "$VERSION" ] || { echo "❌ Version du tag ($VERSION) != package.json ($PACKAGE_VERSION)"; exit 1; }
          [ "$PACKAGE_LICENSE" = "MIT" ] || { echo "❌ La license doit etre MIT"; exit 1; }
          [ "$PACKAGE_PRIVATE" = "false" ] || { echo "❌ Le package est marque private"; exit 1; }
          [ "$PACKAGE_ACCESS" = "public" ] || { echo "❌ publishConfig.access doit etre 'public'"; exit 1; }

          git config --global --add safe.directory "$(pwd)"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main || { echo "❌ Le commit tagge doit appartenir a main"; exit 1; }

          pnpm install --frozen-lockfile
          pnpm check

          DIST_DIR="dist/$PROJECT"
          test -d "$DIST_DIR" || { echo "❌ $DIST_DIR introuvable apres build"; exit 1; }

          BUILT_NAME=$(node -p "require('./$DIST_DIR/package.json').name")
          BUILT_VERSION=$(node -p "require('./$DIST_DIR/package.json').version")
          [ "$BUILT_NAME" = "$EXPECTED_NAME" ] || { echo "❌ Package construit: nom invalide"; exit 1; }
          [ "$BUILT_VERSION" = "$VERSION" ] || { echo "❌ Package construit: version invalide"; exit 1; }
          test -f "$DIST_DIR/$(node -p "require('./$DIST_DIR/package.json').main")" || { echo "❌ Entree 'main' manquante"; exit 1; }
          test -f "$DIST_DIR/$(node -p "require('./$DIST_DIR/package.json').types")" || { echo "❌ Entree 'types' manquante"; exit 1; }

          # `./` prefix is REQUIRED: a single-slash path like `dist/vuejs-ui`
          # is parsed by npm as a GitHub `owner/repo` shorthand (→ git ls-remote
          # ssh://git@github.com/dist/vuejs-ui.git). `./dist/vuejs-ui` forces npm
          # to treat it as a local folder. (Regression when the repo was
          # flattened from dist/libs/vuejs-ui — two slashes — to dist/vuejs-ui.)
          npm pack "./$DIST_DIR" --dry-run

          case "$VERSION" in
            *-*) NPM_DIST_TAG="next" ;;
            *)   NPM_DIST_TAG="latest" ;;
          esac

          # Trusted publishing : npm echange le jeton OIDC du job contre une autorisation, et joint la
          # provenance (lien verifiable vers ce commit et ce workflow). La version est DEPOSEE en
          # attente : elle sort a l'approbation humaine.
          npm stage publish "./$DIST_DIR" --access public --tag "$NPM_DIST_TAG" --provenance
          echo "✅ $PACKAGE_NAME@$VERSION deposee en attente sur npm (dist-tag: $NPM_DIST_TAG) — a approuver sur npmjs.com"
